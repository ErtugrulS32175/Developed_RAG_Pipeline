# Runs the test suite on every push.  A disposable PostgreSQL service is
# mandatory because tenant RLS, immutable eval releases and schema migration
# fences cannot be proven by a fake connection.
stages: [test]

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: CHANGE_ME
  POSTGRES_DB: ragtest_ci
  RAGTEST_OPERATIONS_PG_DSN: postgresql://postgres:CHANGE_ME@postgres:5432/ragtest_ci
  RAGTEST_TENANT_PG_DSN: postgresql://postgres:CHANGE_ME@postgres:5432/ragtest_ci
  RAGTEST_EVIDENCE_PG_DSN: postgresql://postgres:CHANGE_ME@postgres:5432/ragtest_ci
  RAGTEST_REVIEW_PG_DSN: postgresql://postgres:CHANGE_ME@postgres:5432/ragtest_ci
  RAGTEST_EVAL_PG_DSN: postgresql://postgres:CHANGE_ME@postgres:5432/ragtest_ci
  RAGTEST_JOB_PG_DSN: postgresql://postgres:CHANGE_ME@postgres:5432/ragtest_ci
  RAGTEST_PG_TEST_DSN: postgresql://postgres:CHANGE_ME@postgres:5432/ragtest_ci
  RAGTEST_P0_GATE: "1"
  RAGTEST_SCOPE_PG_DSN: postgresql://postgres:CHANGE_ME@postgres:5432/ragtest_ci
  RAGTEST_CONTROL_PG_DSN: postgresql://postgres:CHANGE_ME@postgres:5432/ragtest_ci
  RAGTEST_SCOPE_GATE: "1"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths: [.pip-cache]

test:
  stage: test
  image: python:3.12
  services:
    - name: pgvector/pgvector:pg17
      alias: postgres
  before_script:
    # OpenCV arrives through docling -> rapidocr and loads libGL at import time,
    # so without these the suite dies during collection -- not in the tests that
    # need OpenCV, but in every file that imports the pipeline.
    - apt-get update && apt-get install -y libgl1 libglib2.0-0 nodejs npm
    # The packages are listed here rather than filtered out of requirements.txt.
    # A filter fails silently when it stops matching, and this one did:
    # `grep -v '^vllm$'` matched nothing on a Linux runner because the file was
    # stored with CRLF, so CI installed the multi-GB CUDA serving stack the
    # filter existed to keep out. An explicit list can drift instead, which
    # tests/test_ci_requirements.py checks for.
    #
    # vLLM is a serving dependency, not an orchestration one: nothing under test
    # imports it, and it pins an exact torch that fights this file. Torch itself
    # comes from the CPU index -- no test touches a GPU, and the default wheels
    # drag in several GB of CUDA libraries.
    - pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision torchaudio
    - pip install docling docling-core transformers 'psycopg[binary,pool]' pgvector fastembed python-dotenv requests openpyxl fastapi uvicorn python-multipart
    - pip install pytest httpx jsonschema cryptography
  script:
    - npm ci
    - python scripts/export_openapi.py --check contracts/openapi.json
    - python scripts/check_openapi_compat.py contracts/openapi.v1.json contracts/openapi.json
    - npm run api:generate
    - git diff --exit-code -- clients/typescript/src/schema.ts
    - npm run typecheck
    - python -m pytest tests/ -q
