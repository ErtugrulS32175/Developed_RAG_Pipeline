# Mirror of .gitlab-ci.yml -- the repo is pushed to both remotes, so both need
# to run the suite or one of them silently stops checking.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: CHANGE_ME
          POSTGRES_DB: ragtest_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ragtest_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      RAGTEST_OPERATIONS_PG_DSN: postgresql://postgres:CHANGE_ME@localhost:5432/ragtest_ci
      RAGTEST_TENANT_PG_DSN: postgresql://postgres:CHANGE_ME@localhost:5432/ragtest_ci
      RAGTEST_EVIDENCE_PG_DSN: postgresql://postgres:CHANGE_ME@localhost:5432/ragtest_ci
      RAGTEST_REVIEW_PG_DSN: postgresql://postgres:CHANGE_ME@localhost:5432/ragtest_ci
      RAGTEST_EVAL_PG_DSN: postgresql://postgres:CHANGE_ME@localhost:5432/ragtest_ci
      RAGTEST_JOB_PG_DSN: postgresql://postgres:CHANGE_ME@localhost:5432/ragtest_ci
      RAGTEST_PG_TEST_DSN: postgresql://postgres:CHANGE_ME@localhost:5432/ragtest_ci
      RAGTEST_P0_GATE: "1"
      RAGTEST_SCOPE_PG_DSN: postgresql://postgres:CHANGE_ME@localhost:5432/ragtest_ci
      RAGTEST_SCOPE_GATE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system libraries
        # OpenCV arrives through docling -> rapidocr and loads libGL at import
        # time, so without these the suite dies during collection -- not in the
        # tests that need OpenCV, but in every file that imports the pipeline.
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - name: Install dependencies
        # The packages are listed here rather than filtered out of
        # requirements.txt. A filter fails silently when it stops matching, and
        # this one did: `grep -v '^vllm$'` matched nothing on the Linux runner
        # because the file was stored with CRLF, so CI installed the multi-GB
        # CUDA serving stack the filter existed to keep out. An explicit list
        # can drift instead, which tests/test_ci_requirements.py checks for.
        #
        # vLLM is a serving dependency, not an orchestration one: nothing under
        # test imports it, and it pins an exact torch that fights this file.
        # Torch itself comes from the CPU index -- no test touches a GPU, and
        # the default wheels drag in several GB of CUDA libraries.
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision torchaudio
          pip install docling docling-core transformers 'psycopg[binary,pool]' pgvector fastembed python-dotenv requests openpyxl fastapi uvicorn python-multipart
          pip install pytest httpx jsonschema
      - name: Run tests
        run: python -m pytest tests/ -q
