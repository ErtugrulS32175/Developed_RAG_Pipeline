[pytest]
# data/ holds the operator's documents and output/ holds exports derived
# from them. Neither has ever contained a test, and walking them costs
# real time -- but the reason this line exists is sharper than either: a
# stray file named test_*.py under a document directory becomes a
# COLLECTION ERROR for the whole suite. That happened once, when a probe
# wrote fake repositories into a --basetemp inside output/, and the next
# root run died with 26 errors before running a single real test.
#
# The defaults are repeated because naming this setting replaces them.
norecursedirs = *.egg .* _darcs build CVS dist node_modules venv {arch} data output
